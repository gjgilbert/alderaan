[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alderaan"
dynamic = ["version"]
description = "A python package for fast and robust exoplanet transit lightcurve modeling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "aesara-theano-fallback==0.1.0",
    "arviz==0.12.1",
    "astropy==5.3.2",
    "celerite2==0.2.1",
    "corner==2.2.2",
    "cython==3.0.10",
    "dynesty==2.1.3",
    "exoplanet==0.5.3",
    "exoplanet-core==0.1.2",
    "h5py==3.9.0",
    "ldtk==1.7.0",
    "lightkurve==2.1.1",
    "matplotlib==3.7.2",
    "numba==0.55.1",
    "numpy==1.21.6",
    "pandas==1.5.3",
    "pymc3==3.11.5",
    "pymc3-ext==0.1.1",
    "rebound==4.4.2",
    "scipy==1.7.3",
    "tomli>=1.1; python_version < '3.11'",
    "xarray==2022.9.0",
]

[project.scripts]
alderaan = "alderaan.cli:main"

[project.optional-dependencies]
dev = [
  "pre-commit==4.3.0",
  "pytest==8.3.5",
  "ruff==0.15.17",
  "line_profiler",
  "ipywidgets==8.1.3",
  "notebook==6.4.13",
  "sphinx",
  "sphinxcontrib-napoleon",
  "sphinx-rtd-theme"
]

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
alderaan = ["configs/*.toml"]

[tool.setuptools.dynamic]
version = {attr = "alderaan.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet output; re-run a single failure with --tb=long for full frame context.
# -rxX lists every known-bug xfail (and any XPASS) with its reason on every run.
addopts = "-q --no-header --tb=short -rxX"
# An xfail that passes means its bug is fixed: fail so the marker is removed.
xfail_strict = true

# Ruff is the unified formatter + linter; enforced via .pre-commit-config.yaml.
[tool.ruff]
line-length = 88
target-version = "py39"
extend-exclude = ["legacy"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting, B bugbear, UP pyupgrade,
# G logging-format, LOG logging, N pep8-naming (math notation allowed).
select = ["E", "F", "W", "I", "B", "UP", "G", "LOG", "N"]
ignore = ["N803", "N806", "N812"]

[tool.ruff.lint.isort]
known-first-party = ["alderaan"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports names.
"__init__.py" = ["F401"]
