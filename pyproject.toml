[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alderaan"
dynamic = ["version"]
description = "A python package for fast and robust exoplanet transit lightcurve modeling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# versions match environment.yml
dependencies = [
    "astropy==7.2.0",
    "batman-package @ git+https://github.com/gjgilbert/batman@6fb48346274fd3b108923c41fe5719d999c64505",
    "celerite2==0.3.3",
    "dynesty==3.2.0",
    "ldtk==1.9.3",
    "lightkurve==2.6.0",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pillow==13.0.0",
    "rebound==5.0.1",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[project.scripts]
alderaan = "alderaan.cli:main"

[project.optional-dependencies]
dev = [
  "ipywidgets==8.1.9",
  "line_profiler==5.1.0",
  "notebook==7.6.5",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "ruff==0.15.17",
  "sphinx==9.1.1",
  "sphinx-rtd-theme==3.1.0",
]

[tool.setuptools.packages]
find = {include = ["alderaan*"]}

[tool.setuptools.dynamic]
version = {attr = "alderaan.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet output; re-run a single failure with --tb=long for full frame context.
# -rxX lists every known-bug xfail (and any XPASS) with its reason on every run.
addopts = "-q --no-header --tb=short -rxX"
# An xfail that passes means its bug is fixed: fail so the marker is removed.
xfail_strict = true

# Ruff is the unified formatter + linter; enforced via .pre-commit-config.yaml.
[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import-sorting, B bugbear, UP pyupgrade,
# G logging-format, LOG logging, N pep8-naming (math notation allowed).
select = ["E", "F", "W", "I", "B", "UP", "G", "LOG", "N"]
# B905: zip() strict= not yet audited
ignore = ["N803", "N806", "N812", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["alderaan"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports names.
"__init__.py" = ["F401"]
